<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>병역판정검사 체험 · 부산 2층</title>
<style>
:root{--bg:#F7F3EA;--ink:#4A3A2E;--sub:#8A7A6C;--line:#E4DCCB;--green:#6E8F5E;--green-d:#55724A;--green-l:#E6EFDD;--card:#FFFDF8;--accent:#E8915A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#EDE7DA;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink)}
#app{max-width:430px;margin:0 auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
header h1{font-size:17px;margin:0;font-weight:700}
header small{display:block;font-size:11px;color:var(--sub);font-weight:500;letter-spacing:.04em}
.prog{font-size:13px;font-weight:700;color:var(--green-d);background:var(--green-l);border-radius:14px;padding:6px 12px}
.bar{height:6px;background:var(--line);margin:0 16px;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:3px;transition:width .5s}
.tabs{display:flex;gap:6px;padding:10px 16px 8px;align-items:center}
.tab{font-size:12px;font-weight:700;padding:5px 12px;border-radius:12px;border:1.5px solid var(--line);color:var(--sub);background:var(--card)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.off{opacity:.55}
.tabs button{margin-left:auto;font:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:12px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink)}
#view{position:relative;margin:0 12px;height:52vh;min-height:300px;max-height:470px;border-radius:20px;overflow:hidden;background:#fff;border:2px solid var(--ink);box-shadow:0 5px 0 rgba(74,58,46,.18)}
#world{position:absolute;left:0;top:0;width:1422px;height:1106px;transform-origin:0 0;will-change:transform}
#world.smooth{transition:transform .6s cubic-bezier(.3,.8,.3,1)}
#world>img.floor{position:absolute;left:0;top:0;width:1422px;height:1106px;user-select:none;-webkit-user-drag:none}
#hero{position:absolute;width:86px;height:150px;margin:-142px 0 0 -43px;pointer-events:none;z-index:5}
#hero img{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 0 rgba(74,58,46,.18))}
#hero.flip img{transform:scaleX(-1)}
#hero::after{content:"";position:absolute;left:18px;right:18px;bottom:2px;height:12px;border-radius:50%;background:rgba(74,58,46,.22);z-index:-1}
.mk{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:3px solid var(--ink);background:var(--card);color:var(--ink);font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 4px 0 rgba(74,58,46,.25);opacity:.55}
.mk.done{background:var(--green);color:#fff;opacity:.9}
.mk.next{opacity:1;background:var(--accent);color:#fff;animation:pulse 1.1s ease-in-out infinite;cursor:pointer}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.mission{margin:12px 12px 0;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 rgba(74,58,46,.15)}
.mission .k{font-size:11px;font-weight:700;color:var(--green-d);letter-spacing:.05em}
.mission .t{font-size:17px;font-weight:800;margin:2px 0}
.mission .d{font-size:13px;color:var(--sub);margin-bottom:10px;line-height:1.45}
.btn{display:block;width:100%;font:inherit;font-size:15px;font-weight:800;color:#fff;background:var(--green);border:2px solid var(--ink);border-radius:14px;padding:11px;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{background:#B9C4B0;color:#F2F2EC}
.note{font-size:11px;color:var(--sub);text-align:center;padding:10px 16px 14px;line-height:1.5}
#dim{position:absolute;inset:0;background:rgba(60,48,38,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
#dim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-top:2px solid var(--ink);border-radius:24px 24px 0 0;padding:8px 16px 18px;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);max-height:82%;overflow:auto}
#sheet.on{transform:none}
#sheet .grip{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.shead{display:flex;gap:12px;align-items:center}
.shead img{width:64px;height:112px;object-fit:contain;flex:none}
.shead .n{font-size:11px;font-weight:700;color:var(--green-d);letter-spacing:.05em}
.shead h2{font-size:20px;margin:2px 0 6px}
.bubble{background:var(--green-l);border:1.5px solid var(--green);border-radius:14px;padding:8px 11px;font-size:13px;line-height:1.5}
ul.todo{margin:12px 0 0;padding:0;list-style:none}
ul.todo li{position:relative;padding:7px 0 7px 26px;font-size:14px;line-height:1.5;border-bottom:1px dashed var(--line)}
ul.todo li::before{content:"";position:absolute;left:4px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.banks{display:flex;gap:8px;margin:12px 0 4px}
.banks button{flex:1;font:inherit;font-size:14px;font-weight:800;padding:14px 0;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.banks button.sel{background:#3F6FA8;color:#fff;transform:translateY(3px);box-shadow:none}
.hint{font-size:12px;color:var(--sub);margin:6px 0 0}
h3{font-size:13px;margin:16px 0 4px;color:var(--sub)}
details{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:6px;background:#fff}
summary{font-size:14px;font-weight:700;cursor:pointer;list-style:none}
summary::after{content:"+";float:right;color:var(--sub)}
details[open] summary::after{content:"−"}
details p{font-size:13px;line-height:1.55;margin:8px 0 0;color:#5F5046}
.ask{display:block;text-align:center;font-size:13px;font-weight:700;color:var(--green-d);margin:10px 0 14px;text-decoration:underline}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.8);background:var(--ink);color:#fff;font-weight:800;font-size:15px;padding:10px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:all .3s;z-index:30;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#dbg{position:absolute;left:0;top:0;pointer-events:none;z-index:9}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><small>부산 · 병역판정검사 체험</small>오늘의 검사 동선</h1>
    <span class="prog" id="prog">0 / 9</span>
  </header>
  <div class="bar"><i id="bar"></i></div>
  <div class="tabs">
    <span class="tab off">3층 준비 중</span><span class="tab on">2층</span><span class="tab off">1층 준비 중</span>
    <button id="zoom">전체 보기</button>
  </div>
  <div id="view">
    <div id="world">
      <img class="floor" src="assets/floor2.jpg" alt="부산청 2층 배치도">
      <div id="hero"><img id="heroImg" src="assets/sprites/casual_front.png" alt="체험 캐릭터"></div>
    </div>
  </div>
  <div class="mission">
    <div class="k" id="mk">다음 지점</div>
    <div class="t" id="mt"></div>
    <div class="d" id="md"></div>
    <button class="btn" id="go">이동하기</button>
  </div>
  <div class="note">연구용 시범 화면입니다. 실제 검사장 배치와 절차는 다를 수 있으며, 개인정보를 수집하지 않습니다.</div>
  <div id="dim"></div>
  <div id="sheet"></div>
  <div id="toast"></div>
</div>
<script>
var MAPW=1422,MAPH=1106,SPEED=330;
var START=[710,1005];
var ST=[
 {name:'입구',pos:[710,848],mk:[710,800],route:[[710,905],[710,848]],
  desc:'도로 쪽 계단을 올라 2층 입구로 들어갑니다.',
  say:'입구가 2층이에요. 언덕에 있는 건물이라 그래요.',
  todo:['소지품을 검색대에 올려 위험한 물건이 없는지 확인받습니다.','순번표 발급기에서 번호표를 뽑습니다.'],
  faq:[['검사는 얼마나 걸리나요?','보통 2시간 30분에서 3시간 정도 걸립니다. 그날 인원에 따라 달라질 수 있습니다.']]},
 {name:'대기실',pos:[527,700],mk:[680,690],route:[[590,848],[590,775],[527,760],[527,700]],
  desc:'번호표를 들고 의자에서 순서를 기다립니다.',
  say:'번호가 불리면 접수하러 가요. 긴장 풀고 잠깐 앉아 있어요.',
  todo:['번호표의 순서가 될 때까지 대기 의자에서 기다립니다.','신분증을 미리 꺼내 둡니다.'],
  faq:[]},
 {name:'접수 키오스크',pos:[360,425],mk:[430,420],route:[[535,700],[535,300],[455,300],[360,300],[360,425]],
  desc:'키오스크에서 접수하고 나라사랑카드 은행을 고릅니다.',
  say:'여기서 시간이 가장 많이 걸려요. 은행을 미리 정하고 오면 금방 끝나요.',
  todo:['화면 안내에 따라 접수합니다.','나라사랑카드를 만들 은행을 3곳 중에서 고릅니다. 키오스크에서는 은행만 고르고, 서류는 나중에 씁니다.'],
  kiosk:true,
  faq:[['은행 서류는 언제 쓰나요?','인성검사를 마친 뒤 내 자리에서 작성하고, 고른 은행 창구에 가서 접수합니다.']]},
 {name:'인성검사장 내 자리',pos:[278,655],mk:[278,560],route:[[278,470],[278,655]],
  desc:'컴퓨터가 놓인 자리에 앉아 안내를 듣고 인성검사를 시작합니다.',
  say:'여기가 오늘의 내 자리예요. 다른 검사를 다녀온 뒤에도 이 자리로 돌아와요.',
  todo:['자리에 앉아 단상의 검사 안내를 듣습니다.','컴퓨터로 인성검사를 작성합니다. 시간이 꽤 걸립니다.','작성 도중 약 20명씩 이름이 불리면 하던 것을 멈추고 이동합니다.'],
  faq:[['검사를 하다가 불려 나가면 어떻게 되나요?','걱정하지 않아도 됩니다. 다른 검사를 다녀온 뒤 같은 자리에서 이어서 작성합니다. 불리는 순서는 조마다 다릅니다.']]},
 {name:'탈의실',pos:[1150,300],mk:[1205,200],route:[[278,470],[360,300],[455,300],[535,285],[1000,285],[1040,305],[1150,300]],
  desc:'조가 호출되었습니다. 탈의실에서 검사복으로 갈아입습니다.',
  say:'옷을 갈아입으면 파우치를 하나 받아요. 휴대전화는 거기에 넣어요.',
  todo:['검사복으로 갈아입습니다.','받은 파우치에 휴대전화와 간단한 소지품을 넣어 들고 다닙니다.','원래 옷은 3층 검사까지 모두 끝난 뒤에 다시 갈아입습니다.'],
  change:true,
  faq:[['휴대전화는 어디에 두나요?','탈의실에서 주는 파우치에 넣어 가지고 다닙니다.']]},
 {name:'흉부 X-ray실',pos:[1190,520],mk:[1075,470],route:[[1340,300],[1345,470],[1190,520]],
  desc:'연결 통로를 지나 흉부 촬영을 합니다.',
  say:'촬영은 금방 끝나요. 안내하는 대로 서 있기만 하면 돼요.',
  todo:['신원을 확인합니다.','안내에 따라 흉부 X-ray를 촬영합니다.'],
  faq:[]},
 {name:'중앙계단 (1층 채혈·소변)',pos:[770,614],mk:[770,500],route:[[985,540],[985,632],[880,632],[770,614]],
  desc:'중앙계단으로 1층에 내려가 채혈과 소변검사를 합니다.',
  say:'1층 화면은 아직 준비 중이에요. 다녀왔다고 치고 넘어갈게요.',
  todo:['중앙계단으로 1층에 내려갑니다.','채혈 대기 후 채혈을 하고, 소변검사를 합니다.','끝나면 같은 계단으로 2층 내 자리로 돌아옵니다.'],
  faq:[]},
 {name:'내 자리로 복귀',pos:[278,655],mk:[278,560],route:[[540,614],[535,300],[455,300],[360,300],[278,470],[278,655]],
  desc:'인성검사장으로 돌아와 하던 검사를 이어서 합니다.',
  say:'돌아왔어요. 아까 하던 곳부터 이어서 하면 돼요.',
  todo:['인성검사를 이어서 작성해 마칩니다.','검사를 마쳤으면 자리에서 은행 서류를 작성합니다.'],
  faq:[]},
 {name:'은행 창구',pos:[250,250],mk:[150,250],route:[[278,470],[250,250]],
  desc:'키오스크에서 고른 은행 창구에 서류를 냅니다.',
  say:'검사 호출이 오면 은행보다 검사가 먼저예요.',
  todo:['고른 은행 창구에 서류를 내고 접수합니다.','다 못 마쳤어도 괜찮습니다. 3층 검사가 끝난 뒤 이어서 할 수 있습니다.','이후 조별로 3층에 올라가 신장·체중, 혈압, 시력 검사를 받습니다.'],
  faq:[['은행 접수를 못 끝내고 3층에 올라가면요?','3층 검사를 모두 마친 뒤 2층으로 돌아와 이어서 하면 됩니다. 검사가 항상 먼저입니다.']]}
];
var $=function(id){return document.getElementById(id)};
var world=$('world'),view=$('view'),hero=$('hero'),heroImg=$('heroImg');
var pos=START.slice(),step=0,moving=false,outfit='casual',overview=false,flip=false,bank='';
var DEBUG=location.search.indexOf('debug')>=0;
['front','walk1','walk2','walk3','walk4'].forEach(function(n){['casual','exam'].forEach(function(o){new Image().src='assets/sprites/'+o+'_'+n+'.png'})});
ST.forEach(function(s,i){var m=document.createElement('div');m.className='mk';m.textContent=i+1;m.style.left=s.mk[0]+'px';m.style.top=s.mk[1]+'px';m.onclick=function(){if(i===step)go()};world.appendChild(m);s.el=m});
function sprite(n){heroImg.src='assets/sprites/'+outfit+'_'+n+'.png'}
function place(){hero.style.left=pos[0]+'px';hero.style.top=pos[1]+'px';hero.classList.toggle('flip',flip)}
function cam(smooth){
  var vw=view.clientWidth,vh=view.clientHeight,s,tx,ty;
  if(overview){s=Math.min(vw/MAPW,vh/MAPH);tx=(vw-MAPW*s)/2;ty=(vh-MAPH*s)/2}
  else{s=vw/640;tx=vw/2-pos[0]*s;ty=vh*0.6-pos[1]*s;tx=Math.min(0,Math.max(vw-MAPW*s,tx));ty=Math.min(0,Math.max(vh-MAPH*s,ty))}
  world.classList.toggle('smooth',!!smooth);
  world.style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')';
}
function hud(){
  $('prog').textContent=Math.min(step,ST.length)+' / '+ST.length;
  $('bar').style.width=(step/ST.length*100)+'%';
  ST.forEach(function(s,i){s.el.className='mk'+(i<step?' done':i===step?' next':'');s.el.textContent=i<step?'✓':i+1;
    var same=function(t){return t.mk[0]===s.mk[0]&&t.mk[1]===s.mk[1]};
    s.el.style.display=(ST.some(function(t,j){return same(t)&&((i<step&&j>i&&j<=step)||(i>step&&j<i))}))?'none':''});
  if(step<ST.length){$('mk').textContent='다음 지점 '+(step+1);$('mt').textContent=ST[step].name;$('md').textContent=ST[step].desc;$('go').textContent='이동하기';$('go').disabled=false}
  else{$('mk').textContent='2층 체험 완료';$('mt').textContent='이제 3층으로 올라갈 차례예요';$('md').textContent='3층(신체검사와 판정)과 1층(채혈·소변)은 준비 중입니다.';$('go').textContent='처음부터 다시 하기'}
}
function go(){
  if(moving)return;
  if(step>=ST.length){step=0;outfit='casual';bank='';pos=START.slice();flip=false;sprite('front');place();cam(true);hud();return}
  if(overview){overview=false;$('zoom').textContent='전체 보기'}
  var pts=ST[step].route.slice(),seg=0,last=performance.now(),acc=0,frame=0;
  moving=true;$('go').disabled=true;$('go').textContent='이동 중…';cam(true);
  setTimeout(function(){world.classList.remove('smooth');last=performance.now();requestAnimationFrame(tick)},overview?0:250);
  function tick(now){
    var dt=Math.min(60,now-last);last=now;var left=SPEED*dt/1000;
    while(left>0&&seg<pts.length){
      var dx=pts[seg][0]-pos[0],dy=pts[seg][1]-pos[1],d=Math.sqrt(dx*dx+dy*dy);
      if(Math.abs(dx)>Math.abs(dy)*0.35)flip=dx<0;
      if(d<=left){pos=pts[seg].slice();left-=d;seg++}else{pos[0]+=dx/d*left;pos[1]+=dy/d*left;left=0}
    }
    acc+=dt;if(acc>120){acc=0;frame=(frame+1)%4;sprite('walk'+(frame+1))}
    place();cam(false);
    if(seg<pts.length)requestAnimationFrame(tick);else arrive();
  }
}
function arrive(){moving=false;flip=false;sprite('front');place();$('go').textContent='도착!';setTimeout(openSheet,350)}
function openSheet(){
  var s=ST[step],h='<div class="grip"></div><div class="shead"><img src="assets/sprites/'+outfit+'_front.png" alt=""><div><div class="n">지점 '+(step+1)+' · 2층</div><h2>'+s.name+'</h2><div class="bubble">'+s.say+'</div></div></div>';
  h+='<h3>여기서 하는 일</h3><ul class="todo">'+s.todo.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul>';
  if(s.kiosk)h+='<h3>연습: 은행을 골라 보세요</h3><div class="banks"><button>가 은행</button><button>나 은행</button><button>다 은행</button></div><p class="hint" id="bh">은행 이름과 혜택 비교는 준비 중입니다.</p>';
  if(s.faq.length)h+='<h3>자주 묻는 질문</h3>'+s.faq.map(function(f){return '<details><summary>'+f[0]+'</summary><p>'+f[1]+'</p></details>'}).join('');
  h+='<a class="ask" id="ask">찾는 질문이 없어요 · 질문 남기기</a><button class="btn" id="ok">'+(s.change?'갈아입고 계속하기':'확인했어요')+'</button>';
  var sh=$('sheet');sh.innerHTML=h;sh.scrollTop=0;sh.classList.add('on');$('dim').classList.add('on');
  [].forEach.call(sh.querySelectorAll('.banks button'),function(b){b.onclick=function(){[].forEach.call(sh.querySelectorAll('.banks button'),function(x){x.classList.remove('sel')});b.classList.add('sel');bank=b.textContent;$('bh').textContent=bank+'을 골랐어요. 실제 키오스크에서도 이렇게 고르면 끝납니다.'}});
  $('ask').onclick=function(){toast('질문 접수 창구는 준비 중이에요')};
  $('ok').onclick=closeSheet;
}
function closeSheet(){
  var s=ST[step];$('sheet').classList.remove('on');$('dim').classList.remove('on');
  if(s.change){outfit='exam';sprite('front');toast('검사복으로 갈아입었어요')}
  step++;hud();
  if(step>=ST.length)toast('2층 체험 완료!');
}
var tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},1600)}
$('go').onclick=go;
$('zoom').onclick=function(){if(moving)return;overview=!overview;this.textContent=overview?'가까이 보기':'전체 보기';cam(true)};
window.addEventListener('resize',function(){cam(false)});
if(DEBUG){overview=true;var svg='<svg id="dbg" width="'+MAPW+'" height="'+MAPH+'">',p=START;ST.forEach(function(s,i){svg+='<polyline fill="none" stroke="hsl('+(i*40)+',80%,45%)" stroke-width="6" points="'+[p].concat(s.route).map(function(q){return q.join(',')}).join(' ')+'"/>';p=s.route[s.route.length-1]});world.insertAdjacentHTML('beforeend',svg+'</svg>')}
place();cam(false);hud();
</script>
</body>
