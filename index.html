<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>부산 병역판정검사 체험</title>
<style>
:root{--bg:#F7F3EA;--ink:#4A3A2E;--sub:#8A7A6C;--line:#E4DCCB;--green:#6E8F5E;--green-d:#55724A;--green-l:#E6EFDD;--card:#FFFDF8;--accent:#E8915A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink)}
#app{max-width:430px;margin:0 auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;padding:0 12px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 8px}
header h1{font-size:17px;margin:0;font-weight:700}
header small{display:block;font-size:11px;color:var(--sub);font-weight:500;letter-spacing:.04em}
.prog{font-size:13px;font-weight:700;color:var(--green-d);background:var(--green-l);border-radius:14px;padding:6px 12px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);margin:0 4px;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:3px;transition:width .5s}
.tabs{display:flex;gap:6px;padding:10px 4px 8px;align-items:center}
.tab{font-size:12px;font-weight:700;padding:5px 12px;border-radius:12px;border:1.5px solid var(--line);color:var(--sub);background:var(--card);transition:all .3s}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs #list{margin-left:auto}
.tabs button{font:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:12px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink)}
#view{position:relative;height:52vh;min-height:300px;max-height:470px;border-radius:20px;overflow:hidden;background:#fff;border:2px solid var(--ink);box-shadow:0 5px 0 rgba(74,58,46,.18)}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world.smooth{transition:transform .6s cubic-bezier(.3,.8,.3,1)}
#floorImg{position:absolute;left:0;top:0;user-select:none;-webkit-user-drag:none}
#fade{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .35s;z-index:8;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
#fade.on{opacity:1}
#hero{position:absolute;width:86px;height:150px;margin:-142px 0 0 -43px;pointer-events:none;z-index:5}
#hero img{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 0 rgba(74,58,46,.18))}
#hero.flip img{transform:scaleX(-1)}
#hero::after{content:"";position:absolute;left:18px;right:18px;bottom:2px;height:12px;border-radius:50%;background:rgba(74,58,46,.22);z-index:-1}
.mk{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;border:3px solid var(--ink);background:var(--card);color:var(--ink);font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 4px 0 rgba(74,58,46,.25);opacity:.55}
.mk.done{background:var(--green);color:#fff;opacity:.9}
.mk.next{opacity:1;background:var(--accent);color:#fff;animation:pulse 1.1s ease-in-out infinite;cursor:pointer}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@media (prefers-reduced-motion:reduce){.mk.next{animation:none}}
.mission{margin-top:12px;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 rgba(74,58,46,.15)}
.mission .k{font-size:11px;font-weight:700;color:var(--green-d);letter-spacing:.05em}
.mission .t{font-size:17px;font-weight:800;margin:2px 0}
.mission .d{font-size:13px;color:var(--sub);margin-bottom:10px;line-height:1.45}
.btn{display:block;width:100%;font:inherit;font-size:15px;font-weight:800;color:#fff;background:var(--green);border:2px solid var(--ink);border-radius:14px;padding:11px;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{background:#B9C4B0;color:#F2F2EC}
.note{font-size:11px;color:var(--sub);text-align:center;padding:10px 4px 14px;line-height:1.5}
#dim{position:absolute;inset:0;background:rgba(60,48,38,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
#dim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-top:2px solid var(--ink);border-radius:24px 24px 0 0;padding:8px 16px 18px;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);max-height:82%;overflow:auto}
#sheet.on{transform:none}
#sheet .grip{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.shead{display:flex;gap:12px;align-items:center}
.shead img{width:64px;height:112px;object-fit:contain;flex:none}
.shead .n{font-size:11px;font-weight:700;color:var(--green-d);letter-spacing:.05em}
.shead h2{font-size:20px;margin:2px 0 6px}
.bubble{background:var(--green-l);border:1.5px solid var(--green);border-radius:14px;padding:8px 11px;font-size:13px;line-height:1.5}
ul.todo{margin:12px 0 0;padding:0;list-style:none}
ul.todo li{position:relative;padding:7px 0 7px 26px;font-size:14px;line-height:1.5;border-bottom:1px dashed var(--line)}
ul.todo li::before{content:"";position:absolute;left:4px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.only{margin-top:12px;font-size:13px;line-height:1.5;background:#FFF3E6;border:1.5px dashed var(--accent);border-radius:12px;padding:8px 11px}
.banks{display:flex;gap:8px;margin:12px 0 4px}
.banks button{flex:1;font:inherit;font-size:14px;font-weight:800;padding:14px 0;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer}
.banks button.sel{background:#3F6FA8;color:#fff;transform:translateY(3px);box-shadow:none}
.hint{font-size:12px;color:var(--sub);margin:6px 0 0}
h3{font-size:13px;margin:16px 0 4px;color:var(--sub)}
details{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:6px;background:#fff}
summary{font-size:14px;font-weight:700;cursor:pointer;list-style:none}
summary::after{content:"+";float:right;color:var(--sub)}
details[open] summary::after{content:"−"}
details p{font-size:13px;line-height:1.55;margin:8px 0 0;color:#5F5046}
.ask{display:block;text-align:center;font-size:13px;font-weight:700;color:var(--green-d);margin:10px 0 14px;text-decoration:underline;cursor:pointer}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);background:var(--ink);color:#fff;font-weight:800;font-size:15px;padding:10px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:all .3s;z-index:30;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.mk.edit{font-size:18px;animation:none;cursor:grab;touch-action:none;opacity:.92}
.mk.edit.grab{cursor:grabbing;transform:scale(1.2);z-index:9}
.mrow{display:flex;gap:8px}
.mrow .btn{flex:1}
.sbtn{flex:1;font:inherit;font-size:14px;font-weight:700;padding:10px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.sbtn:disabled{opacity:.35;cursor:default}
.mrow .sbtn{flex:0 0 auto;padding:10px 12px}
.nav{display:flex;gap:8px;margin-bottom:10px}
#editbar{display:none;margin-top:12px;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:12px 14px}
#editbar p{font-size:13px;line-height:1.5;margin:0 0 8px}
#editbar textarea{width:100%;height:120px;font:12px/1.5 ui-monospace,Consolas,monospace;border:1.5px solid var(--line);border-radius:10px;padding:8px;background:#fff;color:var(--ink)}
body.edit #app{max-width:1100px}
body.edit #view{height:72vh;max-height:none}
body.edit .tab{cursor:pointer}
body.edit #editbar{display:block}
body.edit .mission,body.edit #zoom,body.edit #list,body.edit .bar,body.edit #prog{display:none}
.jl{list-style:none;margin:8px 0 0;padding:0}
.jl li{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px dashed var(--line);cursor:pointer;border-radius:10px}
.jl li:hover{background:var(--green-l)}
.jl .no{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;background:var(--card)}
.jl li.done .no{background:var(--green);color:#fff}
.jl li.now .no{background:var(--accent);color:#fff}
.jl .nm{flex:1;font-size:14px;font-weight:700}
.jl .fl{flex:none;font-size:11px;font-weight:700;color:var(--sub);border:1.5px solid var(--line);border-radius:10px;padding:2px 8px}
</style>
</head>

  <div id="sheet"></div>
  <div id="toast"></div>
</div>

<script>
var D=JSON.parse(document.getElementById('data').textContent),F=D.floors,ST=D.steps,SPEED=330,MKUP=-14;
var EDIT=/edit/.test(location.hash+location.search);
var $=function(id){return document.getElementById(id)};
function next(fn){var d=false;function run(){if(!d){d=true;fn(performance.now())}}requestAnimationFrame(run);setTimeout(run,50)}
var world=$('world'),view=$('view'),hero=$('hero'),heroImg=$('heroImg'),floorImg=$('floorImg');
var cur,pos,step=0,moving=false,outfit='casual',overview=false,flip=false,T={tx:0,ty:0,s:1};
function setPos(s,p){s.pos=[Math.round(p[0]),Math.round(p[1])];var r=s.route,last=r[r.length-1];if(Array.isArray(last))r[r.length-1]=s.pos.slice()}
var saved={};try{saved=JSON.parse(localStorage.getItem('mfd_pos')||'{}')}catch(e){}
ST.forEach(function(s,i){if(saved[i+1])setPos(s,saved[i+1])});
['front','walk1','walk2','walk3','walk4'].forEach(function(n){['casual','exam'].forEach(function(o){new Image().src='assets/sprites/'+o+'_'+n+'.png'})});
Object.keys(F).forEach(function(k){new Image().src=F[k].img});
ST.forEach(function(s,i){var m=document.createElement('div');m.className='mk';s.el=m;world.appendChild(m);
  m.onclick=function(){if(EDIT||moving)return;if(i===step)go();else if(i<step)review(i);else goTo(i)};
  if(EDIT)drag(m,s)});
function mkPlace(s){var y=s.pos[1]-MKUP;s.el.style.left=s.pos[0]+'px';s.el.style.top=y+'px'}
function sprite(n){heroImg.src='assets/sprites/'+outfit+'_'+n+'.png'}
function place(){hero.style.left=pos[0]+'px';hero.style.top=pos[1]+'px';hero.classList.toggle('flip',flip)}
function setFloor(f){cur=f;var c=F[f];floorImg.src=c.img;floorImg.style.width=c.w+'px';floorImg.style.height=c.h+'px';world.style.width=c.w+'px';world.style.height=c.h+'px';
  [].forEach.call(document.querySelectorAll('.tab'),function(t){t.classList.toggle('on',+t.dataset.f===f)});marks()}
function cam(smooth){
  var c=F[cur],vw=view.clientWidth,vh=view.clientHeight,s,tx,ty;
  if(overview){s=Math.min(vw/c.w,vh/c.h);tx=(vw-c.w*s)/2;ty=(vh-c.h*s)/2}
  else{s=vw/640;tx=vw/2-pos[0]*s;ty=vh*0.6-pos[1]*s;tx=Math.min(0,Math.max(vw-c.w*s,tx));ty=Math.min(0,Math.max(vh-c.h*s,ty))}
  T={tx:tx,ty:ty,s:s};world.classList.toggle('smooth',!!smooth);
  world.style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')';
}
function marks(){
  ST.forEach(function(s,i){mkPlace(s);
    if(EDIT){s.el.style.display=s.f===cur?'':'none';s.el.className='mk next edit';s.el.textContent=i+1;return}
    var same=function(t){return t.f===s.f&&t.pos[0]===s.pos[0]&&t.pos[1]===s.pos[1]};
    var hide=s.f!==cur||ST.some(function(t,j){return same(t)&&((i<step&&j>i&&j<=step)||(i>step&&j<i&&j>=step))});
    s.el.style.display=hide?'none':'';s.el.className='mk'+(i<step?' done':i===step?' next':'');s.el.textContent=i<step?'✓':i+1});
}
function hud(){
  $('prog').textContent=Math.min(step,ST.length)+' / '+ST.length;
  $('bar').style.width=(step/ST.length*100)+'%';marks();$('back').hidden=step===0;
  if(step<ST.length){var s=ST[step];$('mk').textContent='다음 지점 '+(step+1)+' · '+s.f+'층';$('mt').textContent=s.name;$('md').textContent=s.desc;$('go').textContent=s.f!==cur?s.f+'층으로 이동하기':'이동하기';$('go').disabled=false}
  else{$('mk').textContent='체험 완료';$('mt').textContent='병역판정검사 하루를 모두 둘러봤어요';$('md').textContent='실제로는 2시간 30분에서 3시간 정도 걸립니다. 결과에 따라 다음 단계가 달라집니다.';$('go').textContent='처음부터 다시 하기';$('go').disabled=false}
}
function switchFloor(f,at,done){
  var fd=$('fade');fd.textContent=f+'층';fd.classList.add('on');
  setTimeout(function(){setFloor(f);pos=at.slice();place();cam(false);setTimeout(function(){fd.classList.remove('on');setTimeout(done,250)},350)},380);
}
function outfitBefore(i){var o='casual';for(var j=0;j<i;j++)if(ST[j].outfit)o=ST[j].outfit;return o}
function jump(i){step=i;outfit=outfitBefore(i);overview=false;flip=false;$('zoom').textContent='전체 보기';
  if(i===0){setFloor(D.start.f);pos=D.start.at.slice()}else{setFloor(ST[i-1].f);pos=ST[i-1].pos.slice()}
  sprite('front');place();cam(true);hud()}
function go(){
  if(moving)return;
  if(step>=ST.length){jump(0);return}
  if(overview){overview=false;$('zoom').textContent='전체 보기'}
  var pts=ST[step].route,seg=0,last,acc=0,frame=0;
  moving=true;$('go').disabled=true;$('back').disabled=true;$('go').textContent='이동 중…';cam(true);
  setTimeout(function(){world.classList.remove('smooth');last=performance.now();next(tick)},250);
  function tick(now){
    var dt=Math.min(60,now-last);last=now;var left=SPEED*dt/1000;
    while(left>0&&seg<pts.length){
      var p=pts[seg];
      if(!Array.isArray(p)){seg++;sprite('front');switchFloor(p.f,p.at,function(){last=performance.now();next(tick)});return}
      var dx=p[0]-pos[0],dy=p[1]-pos[1],d=Math.sqrt(dx*dx+dy*dy);
      if(Math.abs(dx)>Math.abs(dy)*0.35)flip=dx<0;
      if(d<=left){pos=p.slice();left-=d;seg++}else{pos[0]+=dx/d*left;pos[1]+=dy/d*left;left=0}
    }
    acc+=dt;if(acc>120){acc=0;frame=(frame+1)%4;sprite('walk'+(frame+1))}
    place();cam(false);
    if(seg<pts.length)next(tick);else arrive();
  }
}
function arrive(){moving=false;$('back').disabled=false;flip=false;sprite('front');place();$('go').textContent='도착!';setTimeout(function(){openSheet(step,false)},350)}
function esc(t){return String(t).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function openSheet(i,rv){
  var s=ST[i],o=rv?outfitBefore(i+1):outfit;
  var h='<div class="grip"></div><div class="shead"><img src="assets/sprites/'+o+'_front.png" alt=""><div><div class="n">'+(rv?'다시 보기 · ':'')+'지점 '+(i+1)+' · '+s.f+'층</div><h2>'+esc(s.name)+'</h2><div class="bubble">'+esc(s.say)+'</div></div></div>';
  h+='<h3>여기서 하는 일</h3><ul class="todo">'+s.todo.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>';
  if(s.only)h+='<div class="only"><b>해당자만</b> · '+esc(s.only)+'</div>';
  if(s.kiosk)h+='<h3>연습: 은행을 골라 보세요</h3><div class="banks"><button>가 은행</button><button>나 은행</button><button>다 은행</button></div><p class="hint" id="bh">은행 이름과 혜택 비교는 준비 중입니다.</p>';
  if(s.faq.length)h+='<h3>자주 묻는 질문</h3>'+s.faq.map(function(f){return '<details><summary>'+esc(f[0])+'</summary><p>'+esc(f[1])+'</p></details>'}).join('');
  h+='<a class="ask" id="ask">찾는 질문이 없어요 · 질문 남기기</a>';
  if(rv)h+='<div class="nav"><button class="sbtn" id="pv"'+(i===0?' disabled':'')+'>◀ 이전 지점</button><button class="sbtn" id="nx"'+(i>=step-1?' disabled':'')+'>다음 지점 ▶</button></div><button class="btn" id="ok">닫기</button><a class="ask" id="redo">이 지점부터 다시 걷기</a>';
  else h+='<button class="btn" id="ok">'+(s.btn||'확인했어요')+'</button>';
  var sh=$('sheet');sh.innerHTML=h;sh.scrollTop=0;sh.classList.add('on');$('dim').classList.add('on');sh.dataset.rv=rv?'1':'';
  [].forEach.call(sh.querySelectorAll('.banks button'),function(b){b.onclick=function(){[].forEach.call(sh.querySelectorAll('.banks button'),function(x){x.classList.remove('sel')});b.classList.add('sel');$('bh').textContent=b.textContent+'을 골랐어요. 실제 키오스크에서도 이렇게 고르면 끝납니다.'}});
  $('ask').onclick=function(){toast('질문 접수 창구는 준비 중이에요')};
  if(rv){$('ok').onclick=hideSheet;$('pv').onclick=function(){openSheet(i-1,true)};$('nx').onclick=function(){openSheet(i+1,true)};
    $('redo').onclick=function(){hideSheet();jump(i);toast((i+1)+'번 지점부터 다시 걸어요')}}
  else $('ok').onclick=closeSheet;
}
function review(i){if(moving||step===0)return;openSheet(Math.max(0,Math.min(i,step-1)),true)}
function hideSheet(){$('sheet').classList.remove('on');$('dim').classList.remove('on')}
function closeSheet(){
  var s=ST[step];hideSheet();
  if(s.outfit&&s.outfit!==outfit){outfit=s.outfit;sprite('front');toast(outfit==='exam'?'검사복으로 갈아입었어요':'원래 옷으로 갈아입었어요')}
  step++;hud();
  if(step>=ST.length)toast('체험 완료!');
}
var tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},1600)}
function openList(){if(moving)return;
  var h='<div class="grip"></div><div class="shead" style="display:block"><div class="n">지점 목록</div><h2>원하는 지점으로 바로 이동</h2></div><ul class="jl">'+
    ST.map(function(t,k){return '<li data-i="'+k+'" class="'+(k<step?'done':k===step?'now':'')+'"><span class="no">'+(k<step?'✓':k+1)+'</span><span class="nm">'+esc(t.name)+'</span><span class="fl">'+t.f+'층</span></li>'}).join('')+
    '</ul><button class="btn" id="ok" style="margin-top:12px">닫기</button>';
  var sh=$('sheet');sh.innerHTML=h;sh.scrollTop=0;sh.dataset.rv='1';sh.classList.add('on');$('dim').classList.add('on');
  $('ok').onclick=hideSheet;
  [].forEach.call(sh.querySelectorAll('.jl li'),function(li){li.onclick=function(){hideSheet();goTo(+li.dataset.i)}});
}
function goTo(i){step=i;outfit=outfitBefore(i);overview=false;flip=false;$('zoom').textContent='전체 보기';
  setFloor(ST[i].f);pos=ST[i].pos.slice();sprite('front');place();cam(true);hud();
  $('go').textContent='도착!';toast((i+1)+'번 '+ST[i].name);setTimeout(function(){openSheet(i,false)},450)}
$('list').onclick=openList;
$('go').onclick=go;
$('back').onclick=function(){review(step-1)};
$('dim').onclick=function(){if($('sheet').dataset.rv)hideSheet()};
$('zoom').onclick=function(){if(moving||EDIT)return;overview=!overview;this.textContent=overview?'가까이 보기':'전체 보기';cam(true)};
window.addEventListener('resize',function(){cam(false)});
function saveAll(){try{var o={};ST.forEach(function(t,k){o[k+1]=t.pos});localStorage.setItem('mfd_pos',JSON.stringify(o))}catch(err){}}
function drag(m,s){
  m.addEventListener('pointerdown',function(e){e.preventDefault();m.setPointerCapture(e.pointerId);m.classList.add('grab');
    function mv(ev){var r=view.getBoundingClientRect();setPos(s,[(ev.clientX-r.left-T.tx)/T.s,(ev.clientY-r.top-T.ty)/T.s]);mkPlace(s);showCode()}
    function up(){m.classList.remove('grab');m.removeEventListener('pointermove',mv);m.removeEventListener('pointerup',up);saveAll()}
    m.addEventListener('pointermove',mv);m.addEventListener('pointerup',up)});
}
function code(){return ST.map(function(t,k){return (k+1)+'. '+t.name+' ('+t.f+'층): '+t.pos[0]+', '+t.pos[1]}).join('\n')}
function showCode(){$('code').value=code()}
